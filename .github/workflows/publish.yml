name: Publish Post from Issue
on:
  issues:
    types: [opened]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'post')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest Version)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Images and Format Post
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Passes the permission token to access the image link
        run: |
          mkdir -p static/images/
          mkdir -p content/blog/
          mkdir -p content/posts/
          
          cat << 'EOF' > download-images.js
          const fs = require('fs');
          const https = require('https');
          const path = require('path');
          const { URL } = require('url');

          let body = process.env.ISSUE_BODY || '';
          const imgRegex = /(!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/.*?)\))|(<img.*?src="(https:\/\/github\.com\/user-attachments\/assets\/.*?)".*?>)/g;
          let match;
          const downloads = [];

          // Helper function that follows redirects to download raw binary image data
          function downloadFile(fileUrl, destPath, token) {
              return new Promise((resolve) => {
                  const options = new URL(fileUrl);
                  options.headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)',
                      'Authorization': `Bearer ${token}`
                  };

                  https.get(options, (response) => {
                      // If GitHub sends a redirect (301/302), follow it to the real asset file
                      if (response.statusCode >= 300 && response.statusCode < 400 && response.headers.location) {
                          downloadFile(response.headers.location, destPath, token).then(resolve);
                          return;
                      }

                      if (response.statusCode === 200) {
                          const file = fs.createWriteStream(destPath);
                          response.pipe(file);
                          file.on('finish', () => {
                              file.close();
                              resolve(true);
                          });
                      } else {
                          resolve(false); // Skip if there's a permanent error
                      }
                  }).on('error', () => resolve(false));
              });
          }

          async function processImages() {
              const matches = [];
              while ((match = imgRegex.exec(body)) !== null) {
                  matches.push({
                      fullMatch: match[0],
                      url: match[2] || match[4]
                  });
              }

              for (let i = 0; i < matches.length; i++) {
                  const item = matches[i];
                  const filename = `issue-${process.env.ISSUE_NUMBER}-${Date.now()}-${i}.png`;
                  const dest = path.join('static', 'images', filename);
                  const webPath = `images/${filename}`;

                  const success = await downloadFile(item.url, dest, process.env.GITHUB_TOKEN);
                  if (success) {
                      body = body.replace(item.fullMatch, `![Image](${webPath})`);
                  }
              }
              fs.writeFileSync('temp_body.md', body);
          }

          processImages();
          EOF

          node download-images.js

          if [ -d "content/posts" ] && [ ! -d "content/blog" ]; then
            TARGET_DIR="content/posts"
          else
            TARGET_DIR="content/blog"
          fi

          FILENAME="${TARGET_DIR}/issue-${ISSUE_NUMBER}.md"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "---" > $FILENAME
          echo "title: \"${ISSUE_TITLE}\"" >> $FILENAME
          echo "date: $DATE" >> $FILENAME
          echo "draft: false" >> $FILENAME
          echo "---" >> $FILENAME
          echo "" >> $FILENAME
          
          if [ -f temp_body.md ]; then
            cat temp_body.md >> $FILENAME
            rm temp_body.md
          else
            echo "${ISSUE_BODY}" >> $FILENAME
          fi
          
          rm -f download-images.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Microblog Bot"
          git config --global user.email "bot@microblog.local"
          git add content/ static/images/ || true
          git commit -m "New post: ${{ github.event.issue.title }}" || echo "No changes to commit"
          git push

      - name: Close the Issue Automatically
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Post successfully processed and images downloaded natively!"
