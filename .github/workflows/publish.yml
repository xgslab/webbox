name: Publish Post from Issue
on:
  issues:
    types: [opened]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'post')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Images and Format Post
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Create missing folders
          mkdir -p static/images/
          mkdir -p content/blog/
          mkdir -p content/posts/
          
          # Write processing script
          cat << 'EOF' > process.js
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          let body = process.env.ISSUE_BODY || '';
          // Catches both regular markdown images and html tags from github uploads
          const regex = /(!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/.*?)\))|(<img.*?src="(https:\/\/github\.com\/user-attachments\/assets\/.*?)".*?>)/g;
          
          let match;
          const matches = [];
          while ((match = regex.exec(body)) !== null) {
              matches.push({
                  full: match[0],
                  url: match[2] || match[4]
              });
          }

          function download(url, dest) {
              return new Promise((resolve) => {
                  const file = fs.createWriteStream(dest);
                  https.get(url, (res) => {
                      if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                          // Follow redirection seamlessly
                          https.get(res.headers.location, (redirRes) => {
                              redirRes.pipe(file);
                              file.on('finish', () => { file.close(); resolve(true); });
                          }).on('error', () => resolve(false));
                      } else {
                          res.pipe(file);
                          file.on('finish', () => { file.close(); resolve(true); });
                      }
                  }).on('error', () => resolve(false));
              });
          }

          async function run() {
              for (let i = 0; i < matches.length; i++) {
                  const filename = `img-${process.env.ISSUE_NUMBER}-${Date.now()}-${i}.png`;
                  const dest = path.join('static', 'images', filename);
                  const relativeWebPath = `/images/${filename}`;
                  
                  const ok = await download(matches[i].url, dest);
                  if (ok) {
                      // Swap the cloud link out for our newly saved local folder path
                      body = body.replace(matches[i].full, `![Image](${relativeWebPath})`);
                  }
              }
              fs.writeFileSync('temp_body.md', body);
          }

          run();
          EOF

          node process.js

          # Figure out theme directory destination
          if [ -d "content/posts" ]; then
            TARGET_DIR="content/posts"
          else
            TARGET_DIR="content/blog"
          fi

          FILENAME="${TARGET_DIR}/issue-${ISSUE_NUMBER}.md"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "---" > $FILENAME
          echo "title: \"${ISSUE_TITLE}\"" >> $FILENAME
          echo "date: $DATE" >> $FILENAME
          echo "draft: false" >> $FILENAME
          echo "---" >> $FILENAME
          echo "" >> $FILENAME
          
          if [ -f temp_body.md ]; then
            cat temp_body.md >> $FILENAME
            rm temp_body.md
          else
            echo "${ISSUE_BODY}" >> $FILENAME
          fi
          rm -f process.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Microblog Bot"
          git config --global user.email "bot@microblog.local"
          git add static/images/ content/ || true
          git commit -m "Add post from issue #${{ github.event.issue.number }}" || echo "No changes"
          git push

      - name: Close the Issue Automatically
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Images downloaded natively and site deployed!"
