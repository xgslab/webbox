name: Publish Post from Issue
on:
  issues:
    types: [opened]

jobs:
  publish:
    if: contains(github.event.issue.labels.*.name, 'post')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (for image processing)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Images and Format Post
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Create an assets folder for images if it doesn't exist
          mkdir -p static/images/
          
          # Use Node to find GitHub uploaded image URLs, download them locally, and update markdown links
          cat << 'EOF' > download-images.js
          const fs = require('fs');
          const https = require('https');
          const path = require('path');

          let body = process.env.ISSUE_BODY || '';
          // Regex to find markdown images or HTML images uploaded by GitHub
          const imgRegex = /(!\[.*?\]\((https:\/\/github\.com\/user-attachments\/assets\/.*?)\))|(<img.*?src="(https:\/\/github\.com\/user-attachments\/assets\/.*?)".*?>)/g;
          let match;
          const downloads = [];

          while ((match = imgRegex.exec(body)) !== null) {
              const fullMatch = match[0];
              const url = match[2] || match[4];
              const ext = '.png'; // GitHub assets are typically image binaries
              const filename = `issue-${process.env.ISSUE_NUMBER}-${Date.now()}-${downloads.length}${ext}`;
              const dest = path.join('static', 'images', filename);
              const webPath = `/images/${filename}`;

              downloads.push(new Promise((resolve) => {
                  const file = fs.createWriteStream(dest);
                  https.get(url, (response) => {
                      response.pipe(file);
                      file.on('finish', () => {
                          file.close();
                          // Replace the GitHub link with our local Hugo path
                          body = body.replace(fullMatch, `![Image](${webPath})`);
                          resolve();
                      });
                  });
              }));
          }

          Promise.all(downloads).then(() => {
              fs.writeFileSync('temp_body.md', body);
          });
          EOF

          node download-images.js

          # Build the final post file
          FILENAME="content/blog/issue-${ISSUE_NUMBER}.md"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "---" > $FILENAME
          echo "title: \"${ISSUE_TITLE}\"" >> $FILENAME
          echo "date: $DATE" >> $FILENAME
          echo "draft: false" >> $FILENAME
          echo "---" >> $FILENAME
          echo "" >> $FILENAME
          cat temp_body.md >> $FILENAME
          rm temp_body.md download-images.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Microblog Bot"
          git config --global user.email "bot@microblog.local"
          git add content/blog/ static/images/ || true
          git commit -m "New post: ${{ github.event.issue.title }}"
          git push

      - name: Close the Issue Automatically
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: " Post successfully processed and sent to Cloudflare Pages!"
